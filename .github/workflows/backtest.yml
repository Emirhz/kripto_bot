name: Backtest Calistir
on:
  workflow_dispatch: # Sadece biz butona basınca çalışır, otomatik çalışmaz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3
      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Kütüphaneleri Yükle
        run: pip install ccxt pandas numpy
      - name: Testi Başlat
        run: python backtest.py